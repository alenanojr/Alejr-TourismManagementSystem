<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5cad" />
    <link rel="icon" type="image/webp" href="/src/assets/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Philippine Tourism – Book Trips and Read Real Visitor Reviews</title>
    <meta name="description" content="Explore beaches, islands, waterfalls and heritage spots across Luzon, Visayas and Mindanao. Book your trip and read real visitor reviews with sentiment analysis." />
    <link rel="canonical" href="https://alejr-tourismmanagementsystem.vercel.app/" />

    <!-- Link previews (Facebook, Messenger, X, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Philippine Tourism" />
    <meta property="og:title" content="Philippine Tourism – Book Trips and Read Real Visitor Reviews" />
    <meta property="og:description" content="Explore beaches, islands, waterfalls and heritage spots across the Philippines. Book your trip and see how real visitors felt." />
    <meta property="og:url" content="https://alejr-tourismmanagementsystem.vercel.app/" />
    <meta property="og:image" content="https://alejr-tourismmanagementsystem.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161b22');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
